name: Propose an improvement
description: Describe a focused feature or improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: What concrete problem would this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior without requiring an unnecessary rewrite.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: List any workarounds or alternatives already tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal concerns the converter, not the Vatican's editorial content.
          required: true
