name: Report a bug
description: Report reproducible cec2info behavior
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please check that no existing issue already describes the problem.
  - type: input
    id: version
    attributes:
      label: cec2info version
      placeholder: "3.5.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Source language
      options:
        - French (fr)
        - English (en)
        - Custom source URL
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact commands and options used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the complete error message after removing sensitive data.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant Python, Texinfo/TeX, and generation-report details.
