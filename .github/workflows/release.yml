name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-zip-perl texinfo texlive-base texlive-binaries

      - name: Install project and build tools
        run: python -m pip install --editable ".[dev]" build

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; expected = f"v{version}"; actual = os.environ["RELEASE_TAG"]; assert actual == expected, f"tag {actual!r} does not match {expected!r}"'

      - name: Run quality checks
        run: make check

      - name: Build distributions
        run: python -m build

      - name: Generate checksums
        run: cd dist && sha256sum * > ../SHA256SUMS

      - name: Store release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --generate-notes --verify-tag --title "cec2info ${GITHUB_REF_NAME#v}"
          fi

  pypi:
    if: vars.PYPI_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cec2info
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
