[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cec2info"
version = "3.5.0"
description = "Convert the Vatican's French Catechism to GNU Info, PDF, and EPUB 3"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.10",
]

classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Religion",
    "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.0",
    "mypy>=1.15",
    "ruff>=0.9",
    "types-beautifulsoup4>=4.12",
]

[project.scripts]
cec2info = "cec2info:main"

[project.urls]
Homepage = "https://github.com/fmaillar/cec-info"
Repository = "https://github.com/fmaillar/cec-info"
Issues = "https://github.com/fmaillar/cec-info/issues"
Changelog = "https://github.com/fmaillar/cec-info/blob/master/CHANGELOG.md"

[tool.setuptools]
py-modules = [
    "cec2info",
    "cec2info_model",
    "cec2info_network",
    "cec2info_output",
    "cec2info_parser",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = [
    "cec2info.py",
    "cec2info_model.py",
    "cec2info_network.py",
    "cec2info_output.py",
    "cec2info_parser.py",
]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = [
    "cec2info",
    "cec2info_model",
    "cec2info_network",
    "cec2info_output",
    "cec2info_parser",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
