[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cec2info"
version = "3.3.0"
description = "Convertit le Catéchisme du Vatican en GNU Info, PDF et EPUB 3"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.10",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Religion",
    "Topic :: Text Processing :: Markup",
]

[project.scripts]
cec2info = "cec2info:main"

[tool.setuptools]
py-modules = ["cec2info"]
